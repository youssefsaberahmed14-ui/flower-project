<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Youka Flory</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --rose: #c0526a;
            --rose-light: #f5d9e0;
            --rose-dark: #8a2a40;
            --cream: #fdf6f0;
            --gold: #c9a96e;
            --green: #4a6741;
            --green-light: #d4e4c8;
            --text-dark: #2a1a1e;
            --text-mid: #6b4a52;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--cream);
            color: var(--text-dark);
            min-height: 100vh;
            padding-top: 70px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(253,246,240,0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(192,82,106,0.15);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-style: italic;
            color: var(--rose-dark);
            letter-spacing: 0.05em;
        }

        .logo span { color: var(--gold); }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav ul a {
            text-decoration: none;
            color: var(--text-mid);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav ul a:hover { color: var(--rose); }

        header {
            background: white;
            padding: 3rem 2rem;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-bottom: 3px solid var(--rose);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-style: italic;
        }

        h1 em {
            color: var(--rose);
        }

        .header-subtitle {
            color: var(--text-mid);
            font-size: 1.05rem;
            font-weight: 300;
        }

        .filters {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
        }

        select, input {
            padding: 10px 15px;
            border: 1px solid rgba(192,82,106,0.2);
            border-radius: 5px;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            background: white;
            color: var(--text-dark);
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--rose);
            background: rgba(245,217,224,0.3);
        }

        .btn {
            padding: 10px 24px;
            background: var(--rose);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Tajawal', sans-serif;
            transition: background 0.3s, transform 0.15s;
        }

        .btn:hover {
            background: var(--rose-dark);
            transform: translateY(-1px);
        }

        .btn.secondary {
            background: var(--text-mid);
        }

        .btn.secondary:hover {
            background: var(--text-dark);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 4px solid var(--rose);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }

        .stat-card.gold {
            border-left-color: var(--gold);
        }

        .stat-card.green {
            border-left-color: var(--green);
        }

        .stat-label {
            color: var(--text-mid);
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            color: var(--text-dark);
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
        }

        .stat-change {
            font-size: 0.9rem;
            color: var(--text-mid);
        }

        .stat-change.positive {
            color: var(--green);
            font-weight: 600;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .chart-title {
            color: var(--text-dark);
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }

        .table-card {
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: rgba(245,217,224,0.3);
        }

        th {
            padding: 16px;
            text-align: left;
            color: var(--text-dark);
            font-weight: 600;
            border-bottom: 2px solid rgba(192,82,106,0.2);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(192,82,106,0.1);
            color: var(--text-mid);
        }

        tr:hover {
            background: rgba(245,217,224,0.15);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-completed {
            background: rgba(74,103,65,0.15);
            color: var(--green);
        }

        .status-pending {
            background: rgba(201,169,110,0.15);
            color: var(--gold);
        }

        .status-cancelled {
            background: rgba(192,82,106,0.15);
            color: var(--rose);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-mid);
        }

        .error {
            background: rgba(192,82,106,0.15);
            color: var(--rose-dark);
            padding: 15px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid var(--rose);
        }

        .footer {
            text-align: center;
            color: var(--text-mid);
            margin-top: 40px;
            padding: 20px;
            font-size: 0.95rem;
        }

        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 0 1rem;
            }

            header {
                padding: 2rem 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 0 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                width: 100%;
            }

            select, input {
                width: 100%;
            }

            table {
                font-size: 0.9rem;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Youka <span>Flory</span></div>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/cart-page">Cart</a></li>
            <li><a href="/dashboard">Dashboard</a></li>
        </ul>
    </nav>

    <div class="container">
        <header>
            <h1>Sales <em>Analytics</em></h1>
            <p class="header-subtitle">Track your flower shop performance and order insights</p>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label for="dateRange">Date Range:</label>
                <select id="dateRange">
                    <option value="7">Last 7 Days</option>
                    <option value="30">Last 30 Days</option>
                    <option value="90">Last 90 Days</option>
                    <option value="365">This Year</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="status">Order Status:</label>
                <select id="status">
                    <option value="">All</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <button class="btn" onclick="applyFilters()">Apply Filter</button>
            <button class="btn secondary" onclick="resetFilters()">Reset</button>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="stats-grid" id="stats">
            <div class="loading">Loading data...</div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">Daily Sales</div>
                <canvas id="dailyChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">Order Status</div>
                <canvas id="statusChart"></canvas>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">Top Products</div>
                <canvas id="productsChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-title">Sales Overview</div>
                <canvas id="summaryChart"></canvas>
            </div>
        </div>

        <div class="table-card">
            <div class="chart-title">Recent Orders</div>
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>Order #</th>
                        <th>Date</th>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            <p>© 2024 Youka Flory - All rights reserved</p>
        </div>
    </div>

    <script>
        let dailyChart, statusChart, productsChart, summaryChart;
        let currentFilters = { dateRange: '7', status: '' };

        async function loadDashboardData() {
            try {
                const response = await fetch(`/api/dashboard?dateRange=${currentFilters.dateRange}&status=${currentFilters.status}`);
                if (!response.ok) throw new Error('Failed to load data');
                const data = await response.json();
                updateStats(data);
                updateCharts(data);
                updateOrdersTable(data.orders);
                document.getElementById('error').style.display = 'none';
            } catch (error) {
                console.error(error);
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error loading data: ' + error.message;
            }
        }

        function updateStats(data) {
            const completedPercent = data.totalOrders > 0 ? ((data.completedOrders / data.totalOrders) * 100).toFixed(1) : '0.0';
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-label">Total Sales</div>
                    <div class="stat-value">$${(data.totalSales || 0).toLocaleString()}</div>
                    <div class="stat-change positive">↑ ${data.salesGrowth || 0}% vs last period</div>
                </div>
                <div class="stat-card gold">
                    <div class="stat-label">Total Orders</div>
                    <div class="stat-value">${data.totalOrders || 0}</div>
                    <div class="stat-change positive">↑ ${data.ordersGrowth || 0}% new orders</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-label">Average Order Value</div>
                    <div class="stat-value">$${(data.averageOrderValue || 0).toLocaleString()}</div>
                    <div class="stat-change">from ${data.totalOrders || 0} orders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Completed Orders</div>
                    <div class="stat-value">${data.completedOrders || 0}</div>
                    <div class="stat-change">${completedPercent}% of all orders</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;
        }

        function updateCharts(data) {
            // Destroy previous charts
            if (dailyChart) dailyChart.destroy();
            if (statusChart) statusChart.destroy();
            if (productsChart) productsChart.destroy();
            if (summaryChart) summaryChart.destroy();

            // Daily sales chart
            const dailyCtx = document.getElementById('dailyChart').getContext('2d');
            const dailyGradient = dailyCtx.createLinearGradient(0, 0, 0, 400);
            dailyGradient.addColorStop(0, 'rgba(192, 82, 106, 0.3)');
            dailyGradient.addColorStop(1, 'rgba(192, 82, 106, 0.01)');
            
            dailyChart = new Chart(dailyCtx, {
                type: 'line',
                data: {
                    labels: data.dailySales.map(d => d.date),
                    datasets: [{
                        label: 'Daily Sales ($)',
                        data: data.dailySales.map(d => d.amount),
                        borderColor: '#c0526a',
                        backgroundColor: dailyGradient,
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#c0526a',
                        pointBorderColor: 'white',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        pointShadowColor: 'rgba(192, 82, 106, 0.2)',
                        pointShadowBlur: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { 
                            display: true,
                            labels: { font: { family: "'Tajawal', sans-serif" }, color: '#2a1a1e' }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            ticks: { font: { family: "'Tajawal', sans-serif" }, color: '#6b4a52' },
                            grid: { color: 'rgba(192, 82, 106, 0.1)' }
                        },
                        x: {
                            ticks: { font: { family: "'Tajawal', sans-serif" }, color: '#6b4a52' },
                            grid: { color: 'rgba(192, 82, 106, 0.05)' }
                        }
                    }
                }
            });

            // Order status chart
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            statusChart = new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Completed', 'Pending', 'Cancelled'],
                    datasets: [{
                        data: [data.completedOrders, data.pendingOrders, data.cancelledOrders],
                        backgroundColor: ['#4a6741', '#c9a96e', '#c0526a'],
                        borderColor: 'white',
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { 
                        legend: { 
                            position: 'bottom',
                            labels: { font: { family: "'Tajawal', sans-serif" }, color: '#2a1a1e', padding: 15 }
                        } 
                    }
                }
            });

            // Top products chart
            const productsCtx = document.getElementById('productsChart').getContext('2d');
            const productsGradient = productsCtx.createLinearGradient(300, 0, 0, 0);
            productsGradient.addColorStop(0, '#c9a96e');
            productsGradient.addColorStop(1, '#c0526a');
            
            productsChart = new Chart(productsCtx, {
                type: 'bar',
                data: {
                    labels: data.topProducts.map(p => p.name),
                    datasets: [{
                        label: 'Sales Volume',
                        data: data.topProducts.map(p => p.sales),
                        backgroundColor: productsGradient,
                        borderColor: '#8a2a40',
                        borderWidth: 1.5,
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { 
                            labels: { font: { family: "'Tajawal', sans-serif" }, color: '#2a1a1e' }
                        }
                    },
                    scales: { 
                        x: { 
                            beginAtZero: true,
                            ticks: { font: { family: "'Tajawal', sans-serif" }, color: '#6b4a52' },
                            grid: { color: 'rgba(192, 82, 106, 0.1)' }
                        },
                        y: {
                            ticks: { font: { family: "'Tajawal', sans-serif" }, color: '#6b4a52' },
                            grid: { display: false }
                        }
                    }
                }
            });

            // Summary chart
            const summaryCtx = document.getElementById('summaryChart').getContext('2d');
            const salesGradient = summaryCtx.createLinearGradient(0, 0, 0, 400);
            salesGradient.addColorStop(0, '#c0526a');
            salesGradient.addColorStop(1, '#f5d9e0');
            
            const ordersGradient = summaryCtx.createLinearGradient(0, 0, 0, 400);
            ordersGradient.addColorStop(0, '#c9a96e');
            ordersGradient.addColorStop(1, '#e8d5c4');
            
            summaryChart = new Chart(summaryCtx, {
                type: 'bar',
                data: {
                    labels: ['Sales ($)', 'Orders (#)'],
                    datasets: [{
                        data: [data.totalSales, data.totalOrders * 100],
                        backgroundColor: [salesGradient, ordersGradient],
                        borderColor: ['#8a2a40', '#8b6f47'],
                        borderWidth: 2,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: { 
                        y: { 
                            beginAtZero: true,
                            ticks: { font: { family: "'Tajawal', sans-serif" }, color: '#6b4a52' },
                            grid: { color: 'rgba(192, 82, 106, 0.1)' }
                        },
                        x: {
                            ticks: { font: { family: "'Tajawal', sans-serif" }, color: '#6b4a52' },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function updateOrdersTable(orders) {
            if (!orders || orders.length === 0) {
                document.getElementById('ordersBody').innerHTML = '<tr><td colspan="6" style="text-align: center;">No orders found</td></tr>';
                return;
            }

            const tbody = document.getElementById('ordersBody');
            tbody.innerHTML = orders.map(order => {
                const orderDate = order.orderDate ? new Date(order.orderDate).toLocaleDateString('ar-EG') : '—';
                const items = Array.isArray(order.items) ? order.items : [];
                const productName = items.length > 0 ? (items[0].name || items[0].productName || 'Ordered item') : 'N/A';
                const quantity = items.length > 0 ? items.reduce((sum, item) => sum + (item.qty || item.quantity || 1), 0) : 0;
                const priceValue = order.totalPrice || order.price || 0;
                const statusLabel = order.statusLabel || order.status || 'Pending';

                return `
                    <tr>
                        <td>#${order.id}</td>
                        <td>${orderDate}</td>
                        <td>${productName}</td>
                        <td>${quantity}</td>
                        <td>$${priceValue.toLocaleString()}</td>
                        <td>
                            <span class="status-badge status-${order.status || 'pending'}">
                                ${statusLabel}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function applyFilters() {
            currentFilters.dateRange = document.getElementById('dateRange').value;
            currentFilters.status = document.getElementById('status').value;
            loadDashboardData();
        }

        function resetFilters() {
            currentFilters = { dateRange: '7', status: '' };
            document.getElementById('dateRange').value = '7';
            document.getElementById('status').value = '';
            loadDashboardData();
        }

        // Load data on page load
        window.addEventListener('load', loadDashboardData);

        // Refresh data every 30 seconds
        setInterval(loadDashboardData, 30000);
    </script>
</body>
</html>
